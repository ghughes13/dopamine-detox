<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Locked — Dopamine Detox</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="theme.css">
  <style>
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 40px;
      text-align: center;
      font-family: var(--dd-serif);
    }
    .dd-text {
      max-width: 800px;
      font-size: 34px;
      line-height: 1.45;
      font-style: italic;
      margin: 0 0 28px;
    }
    .dd-author {
      font-size: 18px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.7;
    }
    .dd-timer {
      margin-top: 56px;
     
      font-size: 15px;
      opacity: 0.5;
    }
    .dd-timer a { color: inherit; }
  </style>
</head>
<body>
  <p class="dd-text" id="text"></p>
  <div class="dd-author" id="author"></div>
  <div class="dd-timer" id="timer"></div>
  <script src="shared.js"></script>
  <script src="quotes.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
